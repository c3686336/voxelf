[package]
name = "voxelf"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "*"
egui = { version = "0.31.1", features = ["bytemuck"] }
egui_winit_vulkano = { version = "0.28.0", default-features = false, features = ["wayland", "x11"] }
glam = {version = "0.32", features = ["bytemuck"]}
half = { version = "2.7", features = ["bytemuck"] }
image = { version = "0.25.8", default-features = false, features = ["hdr", "png"] }
vulkano = "0.35.2"
vulkano-shaders = "0.35.0"
winit = "0.30.0"
shader = { path = "../shader" }

[dev-dependencies]
proptest = "1.10.0"
rand = "0.10.0"

[build-dependencies]
spirv-builder = { git = "https://github.com/Rust-GPU/rust-gpu", rev = "3089687" }
